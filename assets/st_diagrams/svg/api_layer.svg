<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="627px" preserveAspectRatio="none" style="width:1425px;height:627px;background:#FFFFFF;" version="1.1" viewBox="0 0 1425 627" width="1425px" zoomAndPan="magnify"><defs/><g><!--cluster API Layer (Model)--><g id="cluster_API Layer (Model)"><path d="M8.5,6 L131.5,6 A3.75,3.75 0 0 1 134,8.5 L141,29.6094 L1415.5,29.6094 A2.5,2.5 0 0 1 1418,32.1094 L1418,617.5 A2.5,2.5 0 0 1 1415.5,620 L8.5,620 A2.5,2.5 0 0 1 6,617.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="6" x2="141" y1="29.6094" y2="29.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="122" x="10" y="22.5332">API Layer (Model)</text></g><!--class Gateway--><g id="elem_Gateway"><rect codeLine="9" fill="#F1F1F1" height="184.4844" id="Gateway" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="478" x="435" y="42"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55" x="646.5" y="61.5332">Gateway</text><line style="stroke:#181818;stroke-width:0.5;" x1="436" x2="912" y1="69.6094" y2="69.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187" x="441" y="88.1426">#axiosInstance: AxiosInstance</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="238" x="441" y="105.752">+get(url: String): Promise&lt;Response&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="313" x="441" y="123.3613">+post(url: String, data: Any): Promise&lt;Response&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="306" x="441" y="140.9707">+put(url: String, data: Any): Promise&lt;Response&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257" x="441" y="158.5801">+delete(url: String): Promise&lt;Response&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="436" x2="912" y1="165.6563" y2="165.6563"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="448" x="441" y="184.1895">Gestisce l'autenticazione, il refresh dei token e le chiamate base HTTP.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="466" x="441" y="201.7988">Aggiunge il Bearer token ad ogni richiesta e gestisce il rinnovo automatico</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391" x="441" y="219.4082">del token alla scadenza (coda di richieste in attesa di refresh).</text></g><!--class AuthApi--><g id="elem_AuthApi"><rect codeLine="19" fill="#F1F1F1" height="149.2656" id="AuthApi" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="377" x="22.5" y="59.5"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49" x="186.5" y="79.0332">AuthApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="23.5" x2="398.5" y1="87.1094" y2="87.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268" x="28.5" y="105.6426">+login(credentials): Promise&lt;AuthTokens&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="286" x="28.5" y="123.252">+register(credentials): Promise&lt;AuthTokens&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="249" x="28.5" y="140.8613">+refresh(token): Promise&lt;AuthTokens&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="158" x="28.5" y="158.4707">+logout(): Promise&lt;void&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="23.5" x2="398.5" y1="165.5469" y2="165.5469"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="365" x="28.5" y="184.0801">Incapsula le chiamate HTTP verso il microservizio Account</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="352" x="28.5" y="201.6895">per la registrazione, il login e la gestione dei token JWT.</text></g><!--class UsersApi--><g id="elem_UsersApi"><rect codeLine="28" fill="#F1F1F1" height="114.0469" id="UsersApi" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="453" x="948.5" y="77"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56" x="1147" y="96.5332">UsersApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="949.5" x2="1400.5" y1="104.6094" y2="104.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277" x="954.5" y="123.1426">+changePassword(payload): Promise&lt;void&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209" x="954.5" y="140.752">+deleteAccount(): Promise&lt;void&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="949.5" x2="1400.5" y1="147.8281" y2="147.8281"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="441" x="954.5" y="166.3613">Gestisce le operazioni sul profilo utente verso il microservizio Account:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="268" x="954.5" y="183.9707">cambio password ed eliminazione account.</text></g><!--class PatApi--><g id="elem_PatApi"><rect codeLine="35" fill="#F1F1F1" height="131.6563" id="PatApi" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="446" x="22" y="419.5"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41" x="224.5" y="439.0332">PatApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="23" x2="467" y1="447.1094" y2="447.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193" x="28" y="465.6426">+add(payload): Promise&lt;void&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213" x="28" y="483.252">+update(payload): Promise&lt;void&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="208" x="28" y="500.8613">+delete(payload): Promise&lt;void&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="23" x2="467" y1="507.9375" y2="507.9375"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="434" x="28" y="526.4707">Gestisce le operazioni di salvataggio, aggiornamento ed eliminazione</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="391" x="28" y="544.0801">dei Personal Access Token (PAT) per i repository scansionati.</text></g><!--class RepositoriesApi--><g id="elem_RepositoriesApi"><rect codeLine="43" fill="#F1F1F1" height="237.3125" id="RepositoriesApi" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="427" x="503.5" y="367"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="99" x="667.5" y="386.5332">RepositoriesApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="504.5" x2="929.5" y1="394.6094" y2="394.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="285" x="509.5" y="413.1426">+list(params): Promise&lt;PaginatedResponse&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="192" x="509.5" y="430.752">+get(id): Promise&lt;Repository&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="251" x="509.5" y="448.3613">+create(payload): Promise&lt;Repository&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="274" x="509.5" y="465.9707">+update(id, payload): Promise&lt;Repository&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169" x="509.5" y="483.5801">+delete(id): Promise&lt;void&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="290" x="509.5" y="501.1895">+getRanking(): Promise&lt;RankedRepository[]&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="294" x="509.5" y="518.7988">+startAnalysis(id, payload): Promise&lt;Analysis&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="350" x="509.5" y="536.4082">+getHistory(id, params): Promise&lt;PaginatedResponse&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="340" x="509.5" y="554.0176">+compareAnalyses(id, ids): Promise&lt;CompareResult&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="504.5" x2="929.5" y1="561.0938" y2="561.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="404" x="509.5" y="579.627">Gestisce le operazioni CRUD sui repository e l'avvio delle analisi</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="415" x="509.5" y="597.2363">verso il microservizio Analysis. Fornisce anche storico e classifica.</text></g><!--class AnalysisApi--><g id="elem_AnalysisApi"><rect codeLine="57" fill="#F1F1F1" height="149.2656" id="AnalysisApi" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="343" x="965.5" y="411"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72" x="1101" y="430.5332">AnalysisApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="966.5" x2="1307.5" y1="438.6094" y2="438.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10" x="971.5" y="457.1426">--</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="318" x="971.5" y="474.752">Recupera i report di analisi e genera internamente</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228" x="971.5" y="492.3613">l'esportazione nei formati supportati.</text><line style="stroke:#181818;stroke-width:0.5;" x1="966.5" x2="1307.5" y1="499.4375" y2="499.4375"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203" x="971.5" y="517.9707">+getById(id): Promise&lt;Analysis&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="331" x="971.5" y="535.5801">+getHistory(params): Promise&lt;PaginatedResponse&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262" x="971.5" y="553.1895">+exportReport(id, format): Promise&lt;Blob&gt;</text></g><!--link AuthApi to Gateway--><g id="link_AuthApi_Gateway"><path codeLine="65" d="M399.65,134 C411.29,134 417.07,134 428.88,134 " fill="none" id="AuthApi-to-Gateway" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="#181818" points="434.88,134,425.88,130,429.88,134,425.88,138,434.88,134" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21" x="412.52" y="148.4951">usa</text></g><!--reverse link Gateway to UsersApi--><g id="link_Gateway_UsersApi"><path codeLine="66" d="M919.13,134 C930.84,134 936.58,134 948.25,134 " fill="none" id="Gateway-backto-UsersApi" style="stroke:#181818;stroke-width:1.0;stroke