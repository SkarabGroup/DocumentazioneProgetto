00" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.2783" x="286.1142" y="62.291">AnalysisApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="23.06" x2="594.9467" y1="73" y2="73"/><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="33.06" cy="86.7441" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.9395" x="42.06" y="90.5352">getById(id): Promise&lt;Analysis&gt;</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="33.06" cy="103.2324" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="424.0264" x="42.06" y="107.0234">getHistory(params): Promise&lt;PaginatedResponse&lt;Analysis&gt;&gt;</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="33.06" cy="119.7207" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280.875" x="42.06" y="123.5117">exportReport(id, format): Promise&lt;Blob&gt;</text><g data-visibility-modifier="PUBLIC_METHOD"><ellipse cx="33.06" cy="136.209" fill="#84BE84" rx="3" ry="3" style="stroke:#038048;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="547.8867" x="42.06" y="140">updateRemediationDecision(analysisId, remediationId, decision): Promise&lt;void&gt;</text><line style="stroke:#181818;stroke-width:1;" x1="23.06" x2="594.9467" y1="146.9531" y2="146.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="501.2998" x="28.06" y="164.4883">Recupera singoli report tramite GET /analysis/one con body { analysisId },</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="494.7