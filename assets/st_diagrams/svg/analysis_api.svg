<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="511px" preserveAspectRatio="none" style="width:795px;height:511px;background:#FFFFFF;" version="1.1" viewBox="0 0 795 511" width="795px" zoomAndPan="magnify"><defs/><g><!--cluster API Layer (Model)--><g id="cluster_API Layer (Model)"><path d="M8.5,6 L131.5,6 A3.75,3.75 0 0 1 134,8.5 L141,29.6094 L785.5,29.6094 A2.5,2.5 0 0 1 788,32.1094 L788,501.5 A2.5,2.5 0 0 1 785.5,504 L8.5,504 A2.5,2.5 0 0 1 6,501.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6 " fill="none" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="6" x2="141" y1="29.6094" y2="29.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="122" x="10" y="22.5332">API Layer (Model)</text></g><!--class AnalysisApi--><g id="elem_AnalysisApi"><rect codeLine="9" fill="#F1F1F1" height="331.875" id="AnalysisApi" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="750" x="22" y="42"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72" x="361" y="61.5332">AnalysisApi</text><line style="stroke:#181818;stroke-width:0.5;" x1="23" x2="771" y1="69.6094" y2="69.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203" x="28" y="88.1426">+getById(id): Promise&lt;Analysis&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="399" x="28" y="105.752">+getHistory(params): Promise&lt;PaginatedResponse&lt;Analysis&gt;&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="262" x="28" y="123.3613">+exportReport(id, format): Promise&lt;Blob&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="534" x="28" y="140.9707">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD:assets/st_diagrams/code/plantuml/frontend/api/analysis_api.plantuml</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="10" x="28" y="158.5801">--</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="369" x="28" y="176.1895">Recupera singoli report di analisi, lo storico globale di tutte</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="386" x="28" y="193.7988">le analisi dell'utente, esporta i report nei formati JSON e PDF.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="511" x="28" y="235.5332">+updateRemediationDecision(analysisId, remediationId, decision): Promise&lt;void&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="23" x2="392.5" y1="210.9375" y2="210.9375"/><line style="stroke:#181818;stroke-width:1.0;" x1="23" x2="392.5" y1="212.9375" y2="212.9375"/><text fill="#000000" font-family="sans-serif" font-size="16" font-weight="bold" lengthAdjust="spacing" textLength="9" x="392.5" y="216.9844">=</text><line style="stroke:#181818;stroke-width:1.0;" x1="401.5" x2="771" y1="210.9375" y2="210.9375"/><line style="stroke:#181818;stroke-width:1.0;" x1="401.5" x2="771" y1="212.9375" y2="212.9375"/><line style="stroke:#181818;stroke-width:1.0;" x1="23" x2="771" y1="242.6094" y2="242.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="465" x="28" y="261.1426">Recupera singoli report tramite GET /analysis/one con body { analysisId },</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="454" x="28" y="278.752">mappando la risposta al tipo Analysis (meta-dati + DocsAnalysisReport).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="431" x="28" y="296.3613">getHistory chiama GET /analysis/all: ritorna tutte le analisi dell'utente</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="444" x="28" y="313.9707">corrente (userId da JWT) come PaginatedResponse con pagina unica.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="308" x="28" y="331.5801">Gestisce l'esportazione in json/pdf/csv/markdown</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="384" x="28" y="349.1895">e l'aggiornamento delle decisioni sulle remediation suggerite.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="738" x="28" y="366.7988">&gt;&gt;&gt;&gt;&gt;&gt;&gt; d2e4c4cff7167edef0511877b09f78914ea3f1d5:assets/st_diagrams/code/frontend/api/analysis_api.plantuml</text></g><!--class Gateway--><g id="elem_Gateway"><rect fill="#F1F1F1" height="43.6094" id="Gateway" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="61" x="366.5" y="444"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55" x="369.5" y="463.5332">Gateway</text><line style="stroke:#181818;stroke-width:0.5;" x1="367.5" x2="426.5" y1="471.6094" y2="471.6094"/><line style="stroke:#181818;stroke-width:0.5;" x1="367.5" x2="426.5" y1="479.6094" y2="479.6094"/></g><!--link AnalysisApi to Gateway--><g id="link_AnalysisApi_Gateway"><path codeLine="29" d="M397,374.31 C397,401.81 397,420.83 397,437.76 " fill="none" id="AnalysisApi-to-Gateway" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="397,443.76,401,434.76,397,438.76,393,434.76,397,443.76" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21" x="375" y="405.5351">usa</text></g><!--SRC=[ZLJRJjj047ttLunu8L6JEA7GG4GZXOP2K2zHGEeZcknEp3JshhMxXWR4ltVit2marEw3bRdip3bdPkENR79qc86oMMuDcN0RLYb1a